# Fly.io config. Change "app" to the name you pick in `fly launch`.
app = "shopping-list"
primary_region = "sea"

[build]

[env]
  DATA_DIR = "/data"
  AMAZON_PAGE = "amazon.ca"

[mounts]
  source = "shopping_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
